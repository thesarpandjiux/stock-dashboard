name: Cari emiten baru (5 hari)

# Memindai ~150 emiten paling likuid, memberi skor swing, lalu mengisi slot
# kandidat otomatis dengan yang terbaik. Emiten pilihanmu sendiri tidak pernah
# disentuh — hanya slot auto yang dirotasi. Sesudah itu seluruh angka dihitung
# ulang sekalian.
#
# Refresh harga sehari-hari ditangani workflow "Refresh harga harian".
#
# Cron GitHub memakai UTC. `*/5` pada kolom tanggal = tanggal 1, 6, 11, 16,
# 21, 26, 31 — jaraknya 5 hari, kecuali di pergantian bulan. 23:00 UTC =
# 06:00 WIB, sengaja satu jam setelah job harian supaya keduanya tidak
# berebut menulis di menit yang sama.
on:
  schedule:
    - cron: "0 23 */5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cari kandidat swing baru
        run: python screener.py
        continue-on-error: true

      - name: Bangun ulang data.json
        run: python build_dashboard.py

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jangan pernah commit data.json yang rusak — lebih baik job gagal
          # dan dashboard tetap memakai snapshot lama yang masih sah.
          python3 -c "import json; json.load(open('data.json'))"
          git add data.json watchlist_auto.json watchlist_core.txt watchlist_exclude.txt
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "data: rotasi kandidat 5-harian $(date -u '+%Y-%m-%d %H:%M UTC')"
          # data.json adalah berkas hasil generate: kalau remote sempat berubah
          # (mis. cron di Mac ikut menulis), versi hasil run ini yang menang —
          # jangan pernah biarkan git menyisipkan penanda konflik ke dalamnya.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::gagal push setelah 3 percobaan"
          exit 1
