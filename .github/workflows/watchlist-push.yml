name: Rebuild saat watchlist berubah

# Dipakai kalau kamu memilih mode token di dashboard: browser menulis
# langsung ke watchlist_core.txt lewat GitHub API, dan workflow ini yang
# menganalisa emitennya lalu memperbarui data.json.
#
# Catatan: commit yang dibuat GITHUB_TOKEN tidak memicu workflow, jadi
# workflow ini tidak akan memanggil dirinya sendiri (tidak ada loop).

on:
  push:
    branches: [main]
    paths:
      - "watchlist_core.txt"
      - "watchlist_exclude.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bangun ulang data.json
        run: python build_dashboard.py

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Jangan pernah commit data.json yang rusak — lebih baik job gagal
          # dan dashboard tetap memakai snapshot lama yang masih sah.
          python3 -c "import json; json.load(open('data.json'))"
          git add data.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "data: sinkronkan setelah watchlist berubah"
          # data.json adalah berkas hasil generate: kalau remote sempat berubah
          # (mis. cron di Mac ikut menulis), versi hasil run ini yang menang —
          # jangan pernah biarkan git menyisipkan penanda konflik ke dalamnya.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase -X theirs "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              sleep 5
              continue
            fi
            if git push; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::gagal push setelah 3 percobaan"
          exit 1
